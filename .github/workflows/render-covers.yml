name: Render Telegram covers
on:
  push:
    branches: [main]
    paths:
      - 'sources/*.svg'
      - 'sources/**/*.svg'
      - '.github/workflows/render-covers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converters
        run: python -m pip install --disable-pip-version-check cairosvg Pillow
      - name: Render and verify JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          import io
          import cairosvg
          from PIL import Image
          for source in sorted(Path('sources').glob('*.svg')):
              outdir = Path('telegram') / source.stem[:7]
              outdir.mkdir(parents=True, exist_ok=True)
              dest = outdir / (source.stem + '.jpg')
              payload = cairosvg.svg2png(url=str(source), output_width=1200)
              img = Image.open(io.BytesIO(payload)).convert('RGB')
              img.save(dest, format='JPEG', quality=86, optimize=True, progressive=True)
              with Image.open(dest) as check:
                  check.verify()
              print(dest, dest.stat().st_size, 'bytes')
          PY
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Render Telegram JPEG covers"
            git push
          fi
