name: Telegram MCP regression tests
on:
  pull_request:
    paths:
      - 'mcp-server/**'
      - '.github/workflows/telegram-mcp-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check api/mcp.js
      - run: node --check api/updates.js
      - run: node --check lib/business-core.js
      - run: node --check lib/business-store.js
      - run: node --check lib/business-service.js
      - run: node --check lib/business-tools.js
      - run: node --test tests/business.test.mjs tests/audience.test.mjs tests/smoke.test.mjs
