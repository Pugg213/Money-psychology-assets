name: Verify Money Psychology original JPG identity
on:
  push:
    branches: [main]
    paths:
      - 'telegram/**'
      - 'editorial/asset-ledger.json'
      - 'editorial/rich-telegram-queue.json'
      - 'editorial/articles/**'
      - 'editorial/originals/**'
      - 'scripts/verify_publication_queue.mjs'
      - 'scripts/verify_asset_ledger.py'
      - 'scripts/check_editorial_reserve.mjs'
      - '.github/workflows/**'
      - 'mcp-server/**'
  pull_request:
    paths:
      - 'telegram/**'
      - 'editorial/asset-ledger.json'
      - 'editorial/rich-telegram-queue.json'
      - 'editorial/articles/**'
      - 'editorial/originals/**'
      - 'scripts/verify_publication_queue.mjs'
      - 'scripts/verify_asset_ledger.py'
      - 'scripts/check_editorial_reserve.mjs'
      - '.github/workflows/**'
      - 'mcp-server/**'
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC; Moscow stays UTC+03:00 year-round.
    - cron: '15 7,16 * * *' # 10:15 and 19:15 Europe/Moscow
permissions:
  contents: read
jobs:
  asset-integrity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify registered JPEGs (read only; never regenerate)
        run: python scripts/verify_asset_ledger.py

  telegram-mcp-regression:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check api/mcp.js && node --check api/updates.js
      - run: node --check lib/business-core.js && node --check lib/business-store.js && node --check lib/business-service.js && node --check lib/business-tools.js
      - name: Verify canonical queue, asset bindings and article copies
        run: node ../scripts/verify_publication_queue.mjs
      - name: Run every regression test (no Telegram sends)
        run: node --test tests/*.test.mjs

  reserve-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check next seven complete Moscow dates (never send Telegram)
        run: node scripts/check_editorial_reserve.mjs
