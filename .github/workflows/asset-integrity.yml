name: Verify Money Psychology original JPG identity
on:
  push:
    branches: [main]
    paths:
      - 'telegram/**'
      - 'editorial/asset-ledger.json'
      - 'scripts/verify_asset_ledger.py'
      - '.github/workflows/**'
      - 'mcp-server/**'
  pull_request:
    paths:
      - 'telegram/**'
      - 'editorial/asset-ledger.json'
      - 'scripts/verify_asset_ledger.py'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asset-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify registered JPEGs (read only; never regenerate)
        run: python scripts/verify_asset_ledger.py
\n  telegram-mcp-regression:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: mcp-server\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '22'\n      - run: npm install --ignore-scripts --no-audit --no-fund\n      - run: node --check api/mcp.js && node --check api/updates.js\n      - run: node --check lib/business-core.js && node --check lib/business-store.js && node --check lib/business-service.js && node --check lib/business-tools.js\n      - run: node --test tests/business.test.mjs tests/audience.test.mjs tests/smoke.test.mjs\n