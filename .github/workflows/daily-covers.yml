name: Build daily Telegram covers
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_weekly_covers.py'
      - '.github/workflows/daily-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify photo covers
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_weekly_covers.py
      - name: Commit rendered covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram/2026-10/
          if git diff --cached --quiet; then
            echo "No new covers"
          else
            git commit -m "Render seven photographic Telegram covers"
            git push
          fi
